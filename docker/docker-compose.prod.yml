services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parmaconnect
      POSTGRES_USER: parmaconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - parmaconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parmaconnect -d parmaconnect"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://parmaconnect:${POSTGRES_PASSWORD}@postgres:5432/parmaconnect
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi}
      APP_URL: ${APP_URL:?APP_URL wajib diisi}
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  parmaconnect-postgres:
name: parmaconnect-prod
